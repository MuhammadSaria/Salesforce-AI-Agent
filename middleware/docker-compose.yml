services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-providus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-providus}
      POSTGRES_DB: ${POSTGRES_DB:-providus_nexus}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
