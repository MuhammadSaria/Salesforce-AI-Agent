<template>
    <lightning-card>
        <div class="nexus" aria-busy={isBusy}>
            <header class="nexus-header">
                <div>
                    <p class="eyebrow">Salesforce development workspace</p>
                    <h1>Providus Nexus</h1>
                </div>
                <div class="environment-context" aria-label="Trusted Salesforce environment">
                    <lightning-icon icon-name="utility:world" size="x-small" alternative-text="Salesforce environment"></lightning-icon>
                    <span>{environmentLabel}</span>
                </div>
            </header>

            <template if:true={isProduction}>
                <div class="production-warning" role="alert">Production org selected. Review the trusted org context before any approval.</div>
            </template>
            <template if:true={errorMessage}>
                <div class="error" role="alert">{errorMessage}</div>
            </template>
            <template if:true={isBusy}>
                <lightning-spinner alternative-text="Providus Nexus is working" size="small"></lightning-spinner>
            </template>

            <div class="workspace">
                <aside class="conversation-sidebar" aria-label="Conversations">
                    <div class="sidebar-heading">
                        <div>
                            <p class="eyebrow">Persistent history</p>
                            <h2>Conversations</h2>
                        </div>
                        <lightning-button label="Refresh conversation" icon-name="utility:refresh" onclick={handleRefresh} disabled={isBusy}></lightning-button>
                    </div>

                    <section class="new-conversation" aria-labelledby="new-conversation-heading">
                        <h3 id="new-conversation-heading">New conversation</h3>
                        <lightning-textarea
                            data-field="newPrompt"
                            label="Start a new conversation"
                            value={newPrompt}
                            maxlength="8000"
                            onchange={handleValue}
                            disabled={isBusy}>
                        </lightning-textarea>
                        <lightning-button variant="brand" label="Create conversation" icon-name="utility:add" onclick={handleCreate} disabled={createDisabled}></lightning-button>
                    </section>

                    <nav class="conversation-list" aria-label="Saved conversations">
                        <template for:each={jobItems} for:item="item">
                            <button key={item.jobId} type="button" class={item.buttonClass} data-job-id={item.jobId} aria-current={item.ariaCurrent} onclick={handleJobSelection}>
                                <strong>{item.title}</strong>
                                <span>{item.statusText}</span>
                                <time datetime={item.updatedText}>{item.updatedText}</time>
                            </button>
                        </template>
                        <template if:false={jobs.length}>
                            <p class="empty-state">No conversations yet. Start one above.</p>
                        </template>
                    </nav>
                </aside>

                <main class="conversation-workspace">
                    <template if:true={hasSelectedJob}>
                        <header class="conversation-header">
                            <div>
                                <p class="eyebrow">Selected conversation</p>
                                <h2 class="workspace-title">{workspaceTitle}</h2>
                            </div>
                            <div class="org-badge">
                                <span>{orgContext.displayName}</span>
                                <code>{orgContext.expectedOrgId}</code>
                            </div>
                        </header>

                        <section class="progress-card" aria-labelledby="progress-heading" aria-live="polite">
                            <lightning-icon icon-name="utility:sync" size="small" alternative-text="Current lifecycle status"></lightning-icon>
                            <div>
                                <h3 id="progress-heading">Progress</h3>
                                <strong>{statusLabel}</strong>
                                <span class="status-code">{status}</span>
                            </div>
                        </section>

                        <template if:true={hasClarification}>
                            <section class="clarification-card" aria-labelledby="clarification-heading">
                                <lightning-icon icon-name="utility:question" size="small" alternative-text="Clarification required"></lightning-icon>
                                <div>
                                    <h3 id="clarification-heading">Clarification needed</h3>
                                    <p>{clarificationQuestion}</p>
                                    <p class="supporting-text">Reply in the message composer below.</p>
                                </div>
                            </section>
                        </template>

                        <template if:true={hasPlan}>
                            <section class="plan-card" aria-labelledby="plan-heading">
                                <p class="eyebrow">Proposed, server-authoritative plan</p>
                                <h3 id="plan-heading">Implementation plan</h3>
                                <p>{planSummary}</p>
                                <template if:true={hasPlanComponents}>
                                    <ul>
                                        <template for:each={planComponents} for:item="component">
                                            <li key={component.key}>
                                                <strong>{component.label}</strong>
                                                <template if:true={component.description}><span>{component.description}</span></template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </section>
                        </template>

                        <section class="chat-timeline" aria-labelledby="timeline-heading" aria-live="polite">
                            <h3 id="timeline-heading">Conversation</h3>
                            <template for:each={messages} for:item="message">
                                <article key={message.key} class={message.messageClass}>
                                    <header>
                                        <strong>{message.authorLabel}</strong>
                                        <time datetime={message.timestamp}>{message.timestamp}</time>
                                    </header>
                                    <p>{message.text}</p>
                                </article>
                            </template>
                            <template if:false={messages.length}>
                                <p class="empty-state">Conversation history will appear here after the request is accepted.</p>
                            </template>
                        </section>

                        <template if:true={showResult}>
                            <section class="result-card" aria-labelledby="result-heading">
                                <p class="eyebrow">Safe implementation report</p>
                                <h3 id="result-heading">Result</h3>
                                <template if:true={isInactiveFlowDeployment}>
                                    <p class="inactive-result"><strong>Flow deployed inactive (Draft).</strong> The automation is not running.</p>
                                </template>
                                <p>{reportSummary}</p>
                                <template if:true={hasImplementedComponents}>
                                    <h4>Implemented components</h4>
                                    <ul class="result-components">
                                        <template for:each={implementedComponents} for:item="component">
                                            <li key={component.key}>{component.label}</li>
                                        </template>
                                    </ul>
                                </template>
                                <dl>
                                    <template if:true={reportId}><dt>Report identifier</dt><dd>{reportId}</dd></template>
                                    <template if:true={validationResult}><dt>Validation</dt><dd>{validationResult}</dd></template>
                                    <template if:true={deploymentResult}><dt>Deployment</dt><dd>{deploymentResult}</dd></template>
                                    <template if:true={recordEffects}><dt>Record effects</dt><dd>{recordEffects}</dd></template>
                                    <template if:true={concurrencyConsiderations}><dt>Concurrency</dt><dd>{concurrencyConsiderations}</dd></template>
                                </dl>
                            </section>
                        </template>

                        <template if:true={showActionPanel}>
                            <section class="approval-card" aria-labelledby="approval-heading">
                                <h3 id="approval-heading">Supervised action</h3>
                                <lightning-textarea
                                    data-field="actionComments"
                                    label="Approval or rejection comments"
                                    value={actionComments}
                                    maxlength="1000"
                                    onchange={handleValue}
                                    disabled={isActing}>
                                </lightning-textarea>
                                <div class="approval-actions">
                                    <template if:true={canApproveImplementation}>
                                        <lightning-button data-id="approve-implementation" variant="brand" label="Approve implementation" onclick={handleApproveImplementation} disabled={isActing}></lightning-button>
                                        <lightning-button label="Reject implementation" onclick={handleRejectImplementation} disabled={isActing}></lightning-button>
                                    </template>
                                    <template if:true={canApproveDeployment}>
                                        <lightning-button data-id="approve-deployment" variant="brand" label="Approve deployment" onclick={handleApproveDeployment} disabled={isActing}></lightning-button>
                                        <lightning-button label="Reject deployment" onclick={handleRejectDeployment} disabled={isActing}></lightning-button>
                                    </template>
                                    <template if:true={canDeployApprovedChange}>
                                        <lightning-button variant="brand" label="Deploy approved change" onclick={handleDeploy} disabled={isActing}></lightning-button>
                                    </template>
                                </div>
                            </section>
                        </template>

                        <section class="composer" aria-label="Conversation composer">
                            <lightning-textarea
                                data-id="message-input"
                                data-field="draftMessage"
                                label="Message Providus Nexus"
                                value={draftMessage}
                                maxlength="4000"
                                onchange={handleValue}
                                onkeydown={handleComposerKeydown}
                                disabled={messageDisabled}>
                            </lightning-textarea>
                            <div class="composer-footer">
                                <span>Enter sends · Shift+Enter adds a new line</span>
                                <lightning-button variant="brand" label="Send message" icon-name="utility:send" onclick={handleSend} disabled={sendDisabled}></lightning-button>
                            </div>
                        </section>
                    </template>

                    <template if:false={hasSelectedJob}>
                        <div class="workspace-empty">
                            <lightning-icon icon-name="utility:comments" size="large" alternative-text="No conversation selected"></lightning-icon>
                            <h2>Select or start a conversation</h2>
                            <p>Providus Nexus reloads persisted conversation history from the middleware.</p>
                        </div>
                    </template>
                </main>
            </div>
        </div>
    </lightning-card>
</template>
